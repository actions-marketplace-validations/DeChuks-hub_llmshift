name: release
# Publishes to PyPI when a version tag (v0.1.0, ...) is pushed. Uses PyPI trusted
# publishing: no API token is stored anywhere. One-time setup on pypi.org:
# Your account -> Publishing -> add a (pending) publisher with project "llmshift",
# owner "DeChuks-hub", repository "llmshift", workflow "release.yml", environment "pypi".
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]  # version tags only, never the moving major tag (v0)

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.15"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false  # nothing here pushes: the token is not left in .git/config
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false  # nothing here pushes: the token is not left in .git/config
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: The tag must match the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi
          code=$(PYTHONPATH=src python -c "import llmshift; print(llmshift.__version__)")
          if [ "$code" != "$version" ]; then
            echo "::error::src/llmshift/__init__.py says $code but pyproject.toml says $version: llmshift --version would be wrong"
            exit 1
          fi
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install the source archive and run its tests, as packagers do
        run: |
          mkdir sdist-check && tar -xzf dist/*.tar.gz -C sdist-check
          python -m venv sdist-venv
          sdist-venv/bin/python -m pip install --quiet dist/*.tar.gz "pytest>=7"
          cd sdist-check/llmshift-* && ../../sdist-venv/bin/python -m pytest -q -p no:cacheprovider
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  security:  # the same scans as every push; a finding stops the release before PyPI sees it
    uses: ./.github/workflows/security.yml

  publish:
    needs: [test, build, security]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/llmshift/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3: a commit, which no one can move

  mcp-registry:
    # Lists this version in the official MCP Registry (server.json). The registry checks that
    # the README on PyPI names the server (mcp-name:), so this runs after PyPI took it, and it
    # signs in with this workflow's GitHub identity: no token is stored.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install mcp-publisher 1.8.4
        run: |
          curl -fsSL -o mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.4/mcp-publisher_linux_amd64.tar.gz
          echo "5dc2fd415369c73551259f31cd33e2aacc9e0d1021e7f08fef1492d93b781628  mcp-publisher.tar.gz" | sha256sum --check
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher validate server.json
      - run: ./mcp-publisher login github-oidc
      - name: Publish to the MCP Registry
        run: |
          for attempt in 1 2 3 4 5; do  # PyPI can take a minute to show a new release
            ./mcp-publisher publish server.json && exit 0
            sleep 30
          done
          exit 1

  major-tag:
    # `uses: DeChuks-hub/llmshift@v0` follows the newest 0.x release: v0 moves here only
    # after PyPI took the release, and never to a pre-release (v0.2.0rc1). It stays a plain
    # tag, not a GitHub Release, so it can move. The only job that may write.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Point the major tag at this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "$GITHUB_REF_NAME is a pre-release: the major tag stays where it is"
            exit 0
          fi
          major="${GITHUB_REF_NAME%%.*}"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$major" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$major" -f sha="$GITHUB_SHA" -F force=true > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$major" -f sha="$GITHUB_SHA" > /dev/null
          fi
          echo "$major now points at $GITHUB_REF_NAME ($GITHUB_SHA)"
