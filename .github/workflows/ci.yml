name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        exclude:  # setup-python has no 3.9 for Ubuntu 26.04 (ubuntu-latest since October 2026)
          - os: ubuntu-latest
            python-version: "3.9"
        include:
          - os: ubuntu-24.04
            python-version: "3.9"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false  # nothing here pushes: the token is not left in .git/config
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - name: Run the tests
        shell: bash  # runs with -eo pipefail: the step fails when pytest does
        run: python -m pytest -q -rfE 2>&1 | tee pytest.log
      - name: Name the failing tests in annotations (readable without signing in)
        if: failure()
        shell: bash
        run: grep -E "^(FAILED|ERROR) " pytest.log | head -n 20 | sed -e 's/%/%25/g' -e 's/^/::error title=pytest::/' || true
      - run: llmshift demo

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false  # nothing here pushes: the token is not left in .git/config
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run the action against the bundled demo project
        run: python -m pip install . && llmshift demo --dir demo-project
      - uses: ./
        with:
          command: scan
          args: --fail-on never
          working-directory: demo-project

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false  # nothing here pushes: the token is not left in .git/config
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build twine && python -m build && python -m twine check --strict dist/*
      - name: Install the source archive and run its tests, as packagers do
        run: |
          mkdir sdist-check && tar -xzf dist/*.tar.gz -C sdist-check
          python -m venv sdist-venv
          sdist-venv/bin/python -m pip install --quiet dist/*.tar.gz "pytest>=7"
          cd sdist-check/llmshift-* && ../../sdist-venv/bin/python -m pytest -q -p no:cacheprovider
      - name: Validate server.json as the release's MCP Registry step will (mcp-publisher 1.8.4)
        run: |
          curl -fsSL -o mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.4/mcp-publisher_linux_amd64.tar.gz
          echo "5dc2fd415369c73551259f31cd33e2aacc9e0d1021e7f08fef1492d93b781628  mcp-publisher.tar.gz" | sha256sum --check
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher validate server.json
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
