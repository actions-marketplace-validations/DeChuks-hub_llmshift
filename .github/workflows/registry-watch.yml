# Keeps the lifecycle data current, every day:
# 1. scripts/update_registry.py reads the deprecation tables of OpenAI, Anthropic, the
#    Gemini API and Vertex AI and merges new shutdown dates, replacements and newly
#    deprecated models into src/llmshift/data/models.json. When something changed, the
#    test suite runs and the update is committed to main, so `llmshift update` brings it
#    to every user. More than 40 changes at once are not committed: the job fails for a
#    person to review.
# 2. scripts/check_registry_sources.py checks every page the data was built from and
#    opens (or updates) an issue for changes the update could not read, and closes it
#    once every page matches the reviewed state. Unreachable pages do not fail the job.
# After reviewing the pages an issue lists: Actions -> registry-watch -> Run workflow
# with "reviewed" ticked records them as the runner sees them (some pages differ by
# region or time of day), and the issue closes.
name: registry-watch
on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:
    inputs:
      reviewed:
        description: I reviewed the pages listed in the open issue; record them as they are now
        type: boolean
        default: false

permissions: {}  # the job below asks for what it needs

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # commits the updated data
      issues: write  # opens the issue for pages the update could not read
      actions: write  # starts the calendar workflow after a data update
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Update the data from the providers' deprecation tables
        id: update
        run: |
          # Exit code 4: the safe changes were written, but a shutdown date moved earlier (or is
          # already past) and waits for a person; the job publishes the rest and then fails.
          code=0
          python scripts/update_registry.py --write --summary "$RUNNER_TEMP/update.md" || code=$?
          if [ "$code" -eq 4 ]; then
            echo "review=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi
          if git diff --quiet -- src/llmshift/data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test and publish the updated data
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m pytest -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/llmshift/data/models.json src/llmshift/data/sources.json
          git commit -q -F "$RUNNER_TEMP/update.md"
          git push
          # A push made with GITHUB_TOKEN starts no workflow: rebuild the calendar now, not tomorrow.
          gh workflow run calendar.yml --ref "$GITHUB_REF_NAME" || echo "::warning::could not start the calendar workflow"

      - name: Record the reviewed source pages
        if: inputs.reviewed
        run: |
          python scripts/check_registry_sources.py --update
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/llmshift/data/sources.json
          if ! git diff --cached --quiet; then
            git commit -q -m "Record the reviewed lifecycle source pages"
            git push
          fi

      - name: Open an issue for page changes the update did not cover
        if: ${{ !cancelled() }}
        run: python scripts/check_registry_sources.py --issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ask for a review of shutdown dates that moved earlier
        if: steps.update.outputs.review == 'true'
        run: |
          echo "::error title=Lifecycle dates need a review::A provider page moved a shutdown date earlier (or lists one already past). It was not applied; see the update step's output."
          exit 1
